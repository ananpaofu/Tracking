<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f3ee" />
  <meta name="description" content="收纳小管家手机版 · 让每件物品，都有迹可循" />
  <title>收纳小管家 · 手机版</title>
  <link rel="stylesheet" href="mobile.css" />
</head>
<body>
  <div class="ambient ambient-a"></div>
  <div class="ambient ambient-b"></div>

  <div class="device-frame">
    <div class="device-screen">
      <div class="status-bar">
        <span class="sb-time" id="sb-time">9:41</span>
        <div class="sb-right">
          <svg viewBox="0 0 20 14" width="17" height="12" fill="currentColor"><rect x="0" y="9" width="3" height="5" rx="1"/><rect x="5" y="6" width="3" height="8" rx="1"/><rect x="10" y="3" width="3" height="11" rx="1"/><rect x="15" y="0" width="3" height="14" rx="1"/></svg>
          <svg viewBox="0 0 18 14" width="16" height="12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M1 4.5a12 12 0 0 1 16 0M3.5 7.5a8.5 8.5 0 0 1 11 0M6 10.5a5 5 0 0 1 6 0"/><circle cx="9" cy="13" r="1" fill="currentColor" stroke="none"/></svg>
          <svg viewBox="0 0 26 13" width="22" height="12" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="1" width="21" height="11" rx="3"/><rect x="3" y="3" width="15" height="7" rx="1.5" fill="currentColor" stroke="none"/><path d="M24 4.5v4a2 2 0 0 0 0-4Z" fill="currentColor" stroke="none"/></svg>
        </div>
      </div>

      <div class="screen-scroll" id="app-view"></div>

      <nav class="bottom-nav" id="bottom-nav"></nav>
      <div class="home-indicator"></div>

      <div id="sheet-root"></div>
      <div id="overlay-root"></div>
      <div id="toast-root" class="toast-root"></div>
    </div>
    <div class="device-notch"></div>
  </div>

  <script src="mobile.js"></script>
</body>
</html>
